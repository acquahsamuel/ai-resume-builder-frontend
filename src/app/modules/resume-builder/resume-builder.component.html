<div class="app-layout">
  <!-- Desktop Sidebar -->
  <aside class="sidebar" [class.sidebar-collapsed]="isCollapsed">
    <div class="sidebar-header">
      <div class="logo" (click)="toggleSidebar()">
        <i class="pi pi-file-edit"></i>
        @if (!isCollapsed) {
          <span class="brand-name">Cleansheet</span>
        }
      </div>
      @if (!isCollapsed) {
        <button class="collapse-btn" (click)="isCollapsed = true" aria-label="Collapse sidebar">
          <i class="pi pi-angle-left"></i>
        </button>
      }
    </div>

    <nav class="sidebar-nav">
      <a 
        class="nav-item" 
        routerLink="/dashboard" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{exact: true}">
        <i class="pi pi-file-edit"></i>
        <span>Resumes</span>
      </a>

      <a 
        class="nav-item" 
        routerLink="/dashboard/getting-started" 
        routerLinkActive="active">
        <i class="pi pi-briefcase"></i>
        <span>Builder</span>
      </a>

      <a 
        class="nav-item" 
        routerLink="/dashboard/ats-analysis" 
        routerLinkActive="active">
        <i class="pi pi-shield"></i>
        <span>ATS Analyzer</span>
      </a>

      <a 
        class="nav-item" 
        routerLink="/dashboard/settings" 
        routerLinkActive="active">
        <i class="pi pi-cog"></i>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item logout-btn" (click)="logout()" type="button">
        <i class="pi pi-power-off"></i>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-wrapper">
    <header class="main-header">
      <button class="menu-toggle" (click)="toggleMobileSidebar()" aria-label="Toggle menu">
        <i class="pi pi-bars"></i>
      </button>

      <div class="header-title">
        <h1>@if (currentPageTitle) { {{ currentPageTitle }} }</h1>
      </div>
    </header>

    <main class="main-content">
      <router-outlet (activate)="onRouteActivate($event)"></router-outlet>
    </main>
  </div>

  <!-- Mobile Sidebar Overlay -->
  <div 
    class="mobile-sidebar-overlay" 
    [class.active]="isMobileSidebarOpen" 
    (click)="closeMobileSidebar()"
    aria-hidden="true">
  </div>

  <!-- Mobile Sidebar -->
  <aside class="mobile-sidebar" [class.active]="isMobileSidebarOpen">
    <div class="mobile-sidebar-header">
      <div class="logo">
        <i class="pi pi-file-edit"></i>
        <span class="brand-name">Cleansheet</span>
      </div>
      <button class="close-btn" (click)="closeMobileSidebar()" aria-label="Close sidebar">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <nav class="mobile-nav">
      <a 
        class="nav-item" 
        routerLink="/dashboard" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{exact: true}"
        (click)="closeMobileSidebar()">
        <i class="pi pi-file-edit"></i>
        <span>Resumes</span>
      </a>

      <a 
        class="nav-item" 
        routerLink="/dashboard/getting-started" 
        routerLinkActive="active"
        (click)="closeMobileSidebar()">
        <i class="pi pi-briefcase"></i>
        <span>Builder</span>
      </a>

      <a 
        class="nav-item" 
        routerLink="/dashboard/ats-analysis" 
        routerLinkActive="active" 
        (click)="closeMobileSidebar()">
        <i class="pi pi-shield"></i>
        <span>ATS Analyzer</span>
      </a>

      <a 
        class="nav-item" 
        routerLink="/dashboard/settings" 
        routerLinkActive="active" 
        (click)="closeMobileSidebar()">
        <i class="pi pi-cog"></i>
        <span>Settings</span>
      </a>

      <button class="nav-item logout-btn" (click)="logout()" type="button">
        <i class="pi pi-power-off"></i>
        <span>Logout</span>
      </button>
    </nav>
  </aside>
</div>
