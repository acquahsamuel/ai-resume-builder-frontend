<div class=" ">
  <form [formGroup]="experienceForm">
    <div formArrayName="experienceRecords">

      <p-accordion>
        <p-accordionTab
          *ngFor="let experience of experienceRecords.controls; let i = index"
          [formGroupName]="i"
          [header]="experience.get('companyName')?.value || 'New Company'"
          [selected]="true"
        >

        <div class="form-section">
          <div class="flex flex-wrap  -mx-2">
            <div class="form-group w-full px-2 py-2 sm:w-1/2">
              <label for="country"> Job Title </label>
              <input
                placeholder="Enter Job Title"
                formControlName="jobTitle"
                type="text"
                class="tw-input w-full"
              />
            </div>

            <div class="form-group w-full px-2 py-2 sm:w-1/2">
              <label for="country">Company Name </label>
              <input
                type="text"
                placeholder="Enter company name"
                class="tw-input w-full"
                formControlName="companyName"
              />
            </div>
          </div>

          <div class="form-section flex flex-wrap  -mx-2">
            <div class="form-group w-full sm:w-1/2 px-2 py-2">
              <label for="country"> City/Town </label>
              <input
                placeholder="Enter City"
                formControlName="city"
                type="text"
                class="tw-input w-full"
              />
            </div>

            <div class="form-group w-full sm:w-1/2 px-2 py-2">
              <label for="country">Country </label>
              <input
                placeholder="Country"
                type="text"
                formControlName="country"
                class="tw-input w-full"
              />
            </div>
          </div>

          <div class="form-section">
            <div class="form-column flex flex-wrap  -mx-2">
              <div class="form-group flex flex-col w-full sm:w-1/2 px-2 py-2">
                <label for="startYear">Start Date</label>
                <input
                  type="date"
                  id="startYear"
                  formControlName="startYear"
                  class="tw-input w-full"
                  (change)="onDateChange($event)"
                />
              </div>

              <div class="form-group flex flex-col w-full sm:w-1/2 px-2 py-2">
                <label for="endYear">End Date</label>
                <input
                  type="date"
                  id="endYear"
                  formControlName="endYear"
                  class="tw-input w-full"
                  (change)="onDateChange($event)"
                  [disabled]="experience.get('currentlyHere')?.value"
                />
              </div>

              <div class="form-group w-full sm:w-1/2 px-2 py-2">
                <label class="tw-checkbox-label">
                  <input
                    type="checkbox"
                    id="currentlyHere"
                    formControlName="currentlyHere"
                    class="tw-checkbox"
                  />
                  <span>I Currently work here</span>
                </label>
              </div>
            </div>
          </div>

      
            <div class="form-group    -mx-2  px-2 py-2">
              <div class="checkbox-wrapper-14">
                <label
                  for="s1-14"
                  class="font-normal"
                >
                  Company Website
                </label>
                <input 
                  type="text"
                  formControlName="companyWebsite"
                  class="tw-input w-full"
                  placeholder="https://..."
                />
              </div>
            </div>
          

          <div>
            <div class="form-group px-2 py-2 -mx-2">
              <label for=""> Role Description </label>
              <app-custom-editor formControlName="description"></app-custom-editor>
            </div>
          </div>

          <div class="flex justify-end">
            <button
              type="button"
              (click)="removeExperienceRecord(i)"
              class="tw-btn-danger"
            >
              <i class="pi pi-trash"></i>
              <span>Remove</span>
            </button>
          </div>
        </div>

      </p-accordionTab>
    </p-accordion>

      <!-- </div> -->
    </div>
     

    <button
      class="tw-btn-add"
      (click)="addExperienceRecord()"
      type="button"
    >
      <i class="pi pi-plus"></i>
      <span>+ Add Experience</span>
    </button>
  </form>
</div>
