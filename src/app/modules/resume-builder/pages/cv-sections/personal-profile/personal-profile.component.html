<div class="file-upload-container mb-6">
  <div class="flex items-center gap-4">
    <div *ngIf="imagePreview; else noTemplate" class="image-preview">
      <img
        [src]="imagePreview"
        alt="Image preview"
        class="w-24 h-24 rounded-full object-cover"
      />
    </div>

    <ng-template #noTemplate>
      <div class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center">
        <i class="pi pi-user text-4xl text-gray-400"></i>
      </div>
    </ng-template>

    <div class="flex-1">
      <label for="profile-upload" class="file-upload-label">
        <span class="file-upload-icon"><i class="pi pi-upload"></i></span>
        <span class="file-upload-text">Upload Profile Picture</span>
        <input
          id="profile-upload"
          (change)="onFileChange($event)"
          class="file-input"
          type="file"
          accept="image/*"
        />
      </label>
      <p class="text-xs text-gray-500 mt-2">Headshot profile pictures are preferred (max 5MB)</p>
    </div>
  </div>
</div>

<form [formGroup]="headerInfoForm" (ngSubmit)="submitForm()">
  <div class="form-section">
    <div class="form-grid">
      <div class="form-field">
        <label for="firstName">First Name *</label>
        <input 
          type="text"
          id="firstName" 
          formControlName="firstName" 
          placeholder="Enter first name"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="lastName">Last Name *</label>
        <input 
          type="text"
          id="lastName" 
          formControlName="lastName" 
          placeholder="Enter last name"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="nationality">Nationality</label>
        <input 
          type="text"
          id="nationality" 
          formControlName="nationality" 
          placeholder="e.g., Ghanaian"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="city">City</label>
        <input 
          type="text"
          id="city" 
          formControlName="city" 
          placeholder="Enter city"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="state">State / Province</label>
        <input 
          type="text"
          id="state" 
          formControlName="state" 
          placeholder="Enter state or province"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="country">Country</label>
        <input 
          type="text"
          id="country" 
          formControlName="country" 
          placeholder="Enter country"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="zipCode">Zip Code / Postal Code</label>
        <input 
          type="text"
          id="zipCode" 
          formControlName="zipCode" 
          placeholder="Enter zip code"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="phone">Phone Number</label>
        <input 
          type="tel"
          id="phone" 
          formControlName="phone" 
          placeholder="+1234567890"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="email">Email Address *</label>
        <input 
          type="email"
          id="email" 
          formControlName="email" 
          placeholder="your.email@example.com"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="otherName">Other Name / Middle Name</label>
        <input 
          type="text"
          id="otherName" 
          formControlName="otherName" 
          placeholder="Enter middle name (optional)"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="title">Professional Title</label>
        <input 
          type="text"
          id="title" 
          formControlName="title" 
          placeholder="e.g., Software Engineer"
          class="tw-input"
        />
      </div>

      <div class="form-field">
        <label for="dateOfBirth">Date of Birth</label>
        <input 
          type="date"
          id="dateOfBirth" 
          formControlName="dateOfBirth"
          class="tw-input"
        />
      </div>
    </div>

    <!-- Social Media Links -->
    <div class="social-fields-section">
      <div class="section-header">
        <h3 class="section-title">Social Media Links</h3>
        <p class="section-subtitle">Add your professional social media profiles</p>
      </div>
      
      <div class="social-fields">
        <div
          *ngFor="let social of socialMedia.controls; let i = index"
          [formGroup]="social"
          class="social-card"
        >
          <div class="social-icon" [class.has-platform]="social.get('platform')?.value">
            <i [class]="getFieldIcon(social.get('platform')?.value || '')"></i>
          </div>

          <div class="social-inputs">
            <input
              type="text"
              formControlName="platform"
              [id]="'platform-' + i"
              placeholder="Platform (e.g., LinkedIn, GitHub)"
              (input)="onSocialChange(i)"
              class="tw-input social-input"
            />
            
            <input
              type="url"
              formControlName="link"
              [id]="'link-' + i"
              placeholder="https://..."
              class="tw-input social-input"
            />
          </div>

          <button
            *ngIf="socialMedia.length > 1"
            type="button"
            class="remove-btn"
            (click)="removeSocialMedia(i)"
            title="Remove"
          >
            <i class="pi pi-times"></i>
          </button>
        </div>
      </div>

      <button
        type="button"
        class="add-social-btn"
        (click)="addSocialMedia()"
      >
        <i class="pi pi-plus-circle"></i>
        <span>Add Social Media Link</span>
      </button>
    </div>

    <!-- Form Actions -->
    <div class="form-actions-footer">
      <button
        type="button"
        class="tw-btn-secondary"
      >
        <i class="pi pi-times"></i>
        <span>Cancel</span>
      </button>
      <button
        type="submit"
        class="tw-btn-primary"
      >
        <i class="pi pi-check"></i>
        <span>Save</span>
      </button>
    </div>
  </div>
</form>
