<div class="form-section">
  <div [formGroup]="hobbiesForm">
    <div>
      <div class="education-record">
        <h3></h3>

        <div class="form-group w-full">
          <div class="flex flex-col">
            <label for="hobbies"> Hobbies </label>
            <select
              id="hobbies"
              multiple
              class="tw-select tw-select-multiple w-full"
              size="5"
            >
              <option *ngFor="let option of listOfOption" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
            <p class="text-xs text-gray-500 mt-1">Hold Ctrl/Cmd to select multiple</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
