<div class="form-section">
  <form [formGroup]="languagesForm">
    <div formArrayName="languagesRecords">
      <div
        *ngFor="let language of languagesRecords.controls; let i = index"
        [formGroupName]="i"
        class="language-record"
      >
        <h3></h3>

        <div class="form-section">
          <div class="form-group">
            <label for="language-{{i}}">Language</label>
            <input
              id="language-{{i}}"
              type="text"
              formControlName="name"
              placeholder="e.g., English, Spanish"
              class="tw-input"
            />
          </div>

          <div class="example-input">
            <label for="proficiency-{{i}}">Proficiency</label>
            <select
              id="proficiency-{{i}}"
              formControlName="proficiency"
              class="tw-select"
            >
              <option value="">Select proficiency level</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
              <option value="Expert">Expert</option>
              <option value="Master">Master</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button
            type="button"
            (click)="removeLanguageRecord(i)"
            class="tw-btn-danger"
          >
            <i class="pi pi-trash"></i>
            <span>Remove</span>
          </button>
        </div>
      </div>
    </div>

    <button
      type="button"
      (click)="addLanguageRecord()"
      class="tw-btn-add"
    >
      <i class="pi pi-plus"></i>
      <span>+ Add Language</span>
    </button>
  </form>
</div>
