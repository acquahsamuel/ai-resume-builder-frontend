<div class="form-section">
  <form [formGroup]="extraActivitiesForm">
    <div formArrayName="extraActivitiesRecords">
      <div
        *ngFor="let activity of extraActivitiesRecords.controls; let i = index"
        [formGroupName]="i"
        class="extra-activity-record"
      >
        <h3></h3>

        <div class="form-section flex flex-wrap -mx-2">
          <div class="form-group w-full  px-2 py-2 sm:w-1/2">
            <label for="name"> Activity Name </label>
            <input
              id="name"
              type="text"
              placeholder="Enter activity name"
              formControlName="name"
              class="tw-input w-full"
            />
          </div>

          <div class="example-input   sm:w-1/2  px-2 py-2">
            <label for="organization"> Organization  </label>
            <input
              id="organization"
              type="text"
              placeholder="Enter organization name"
              formControlName="organization"
              class="tw-input w-full"
            />
          </div>

          <div class="example-input   sm:w-1/2  px-2 py-2">
            <label for="role"> Role </label>
            <input
              id="role"
              type="text"
              placeholder="Enter role/position"
              formControlName="role"
              class="tw-input w-full"
            />
          </div>
        </div>

        <div class="form-section flex flex-wrap -mx-2">
          <div class="form-group w-full px-2 py-2 sm:w-1/2">
            <label for="startYear">Start Year</label>
            <input
              type="date"
              id="startYear"
              formControlName="startYear"
              class="tw-input w-full"
              (change)="onDateChange($event)"
            />
          </div>

          <div class="form-group w-full px-2 py-2 sm:w-1/2">
            <label for="endYear">End Year</label>
            <input
              type="date"
              id="endYear"
              formControlName="endYear"
              class="tw-input w-full"
              (change)="onDateChange($event)"
            />
          </div>
        </div>

        <div class="form-section flex flex-wrap -mx-2">
          <div class="form-group w-full px-2 py-2 -mx-2">
            <label for="description">Description</label>
            <app-custom-editor formControlName="description"></app-custom-editor>
          </div>
        </div>

        <div class="form-actions">
          <button
            type="button"
            (click)="removeExtraActivityRecord(i)"
            class="tw-btn-danger"
          >
            <i class="pi pi-trash"></i>
            <span>Remove</span>
          </button>
        </div>
      </div>
    </div>

    <button
      type="button"
      (click)="addExtraActivityRecord()"
      class="tw-btn-add"
    >
      <i class="pi pi-plus"></i>
      <span>+ Add Activity</span>
    </button>
  </form>
</div>
