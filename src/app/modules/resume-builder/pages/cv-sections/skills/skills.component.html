<div class="form-section">
  <form [formGroup]="skillsForm">
    <div formArrayName="skillsRecords">

      <p-accordion>
        <p-accordionTab
          *ngFor="let skills of skillsRecord.controls; let i = index"
          [formGroupName]="i"
          [header]="skills.get('name')?.value || 'New Skill'"
          [selected]="true"
        >
 
        <div class="form-section flex flex-wrap -mx-2">
          <div class="form-group w-full px-2 py-2 sm:w-1/2">
            <label for="name"> Skill </label>
            <input
              id="name"
              type="text"
              placeholder=" Enter Skill"
              formControlName="name"
              class="tw-input w-full"
            />
          </div>

          <div class="example-input px-2 py-2 sm:w-1/2">
            <label for="proficiency"> Proficiency </label>
            <select
              id="proficiency"
              formControlName="proficiency"
              class="tw-select w-full"
            >
              <option value="">Select Proficiency</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
              <option value="Expert">Expert</option>
              <option value="Master">Master</option>
            </select>
          </div>
        </div>

        <div class="form-section w-full flex flex-wrap py-2 sm:w-1/2">
          <label for="skillLevel"> Level </label>
          <input
            type="range"
            id="skillLevel"
            formControlName="skillLevel"
            min="0"
            max="100"
            step="1"
            class="tw-range w-full"
          />
          <span class="tw-range-value">{{ skills.get('skillLevel')?.value || 0 }}%</span>
        </div>

        <div class="form-actions">
          <button
            type="button"
            (click)="removeSkillRecord(i)"
            class="tw-btn-danger"
          >
            <i class="pi pi-trash"></i>
            <span>Remove</span>
          </button>
        </div>

      </p-accordionTab>
    </p-accordion>

      </div>
    <!-- </div> -->


    <button
      type="button"
      (click)="addSkillRecord()"
      class="tw-btn-add"
    >
      <i class="pi pi-plus"></i>
      <span>+ Add Skill</span>
    </button>
  </form>
</div>
