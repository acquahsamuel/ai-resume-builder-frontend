<div class=" ">
  <form [formGroup]="internshipsForm">
    <div formArrayName="internshipRecords">

      <p-accordion>
        <p-accordionTab
          *ngFor="let internship of internshipRecords.controls; let i = index"
          [formGroupName]="i"
          [header]="internship.get('jobTitle')?.value || 'New Internship'"
          [selected]="true"
        >

        <div class="form-section">
          <div class="flex flex-wrap  -mx-2">
            <div class="form-group w-full px-2 py-2 sm:w-1/2">
              <label for="jobTitle"> Job Title *</label>
              <input
                placeholder="Enter Job Title"
                formControlName="jobTitle"
                type="text"
                class="tw-input w-full"
              />
            </div>

            <div class="form-group w-full px-2 py-2 sm:w-1/2">
              <label for="company">Company Name *</label>
              <input
                type="text"
                placeholder="Enter company name"
                class="tw-input w-full"
                formControlName="companyName"
              />
            </div>
          </div>

          <div class="form-section flex flex-wrap  -mx-2">
            <div class="form-group w-full sm:w-1/2 px-2 py-2">
              <label for="city"> City/Town *</label>
              <input
                placeholder="Enter City"
                formControlName="city"
                type="text"
                class="tw-input w-full"
              />
            </div>

            <div class="form-group w-full px-2 py-2 sm:w-1/2">
              <label for="country"> Country *</label>
              <input
                placeholder="Enter Country"
                formControlName="country"
                type="text"
                class="tw-input w-full"
              />
            </div>
          </div>

          <div class="form-section flex flex-wrap  -mx-2">
            <div class="form-group w-full sm:w-1/2 px-2 py-2">
              <label for="startYear"> Start Date *</label>
              <input
                type="date"
                id="startYear"
                formControlName="startYear"
                class="tw-input w-full"
                (change)="onDateChange($event)"
              />
            </div>

            <div class="form-group w-full px-2 py-2 sm:w-1/2">
              <label for="endYear"> End Date *</label>
              <input
                type="date"
                id="endYear"
                formControlName="endYear"
                class="tw-input w-full"
                (change)="onDateChange($event)"
                [disabled]="internship.get('currentlyHere')?.value"
              />
            </div>
          </div>

          <div class="form-section flex flex-wrap  -mx-2">
            <div class="form-group w-full sm:w-1/2 px-2 py-2">
              <label for="companyWebsite"> Company Website</label>
              <input
                placeholder="https://..."
                formControlName="companyWebsite"
                type="url"
                class="tw-input w-full"
              />
            </div>

            <div class="form-group w-full px-2 py-2 sm:w-1/2 flex items-center">
              <label class="tw-switch-label">
                <input
                  type="checkbox"
                  formControlName="currentlyHere"
                  class="tw-switch"
                />
                <span class="tw-switch-slider"></span>
                <span>Currently working here</span>
              </label>
            </div>
          </div>

          <div class="form-group px-2 py-2 -mx-2">
            <label for="description"> Description</label>
            <app-custom-editor formControlName="description"></app-custom-editor>
          </div>
        </div>

        <div class="form-actions">
          <button
            type="button"
            (click)="removeInternshipRecord(i)"
            class="tw-btn-danger"
          >
            <i class="pi pi-trash"></i>
            <span>Remove</span>
          </button>
        </div>
        </p-accordionTab>
      </p-accordion>
    </div>

    <button
      type="button"
      (click)="addInternshipRecord()"
      class="tw-btn-add"
    >
      <i class="pi pi-plus"></i>
      <span>+ Add Internship</span>
    </button>
  </form>
</div>
