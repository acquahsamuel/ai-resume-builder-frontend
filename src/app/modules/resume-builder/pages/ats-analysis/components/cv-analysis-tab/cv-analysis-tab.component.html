<div class="grid lg:grid-cols-2 gap-6 mt-4">
  <!-- Left: Upload Section -->
  <div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
          <i class="pi pi-upload text-green-600 text-xl"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-900">Upload Your CV</h2>
      </div>

      <!-- Upload Area -->
      <div
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)"
        (click)="triggerFileInput()"
        class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-green-400 transition-colors bg-gray-50 cursor-pointer"
      >
        <i class="pi pi-cloud-upload text-5xl text-gray-400 mb-4"></i>
        <p class="text-gray-700 font-medium mb-1">Click to upload or drag and drop</p>
        <p class="text-sm text-gray-500">PDF or DOCX (max 10MB)</p>
        <input
          id="file-input-cvOnly"
          type="file"
          accept=".pdf,.docx"
          class="hidden"
          (change)="onFileSelected($event)"
        />
      </div>

      <!-- File Info -->
      <div *ngIf="uploadedFile" class="mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <i class="pi pi-file text-green-600 text-xl"></i>
            <div>
              <p class="font-medium text-gray-900">{{ uploadedFile.fileName }}</p>
              <p class="text-sm text-gray-500">{{ uploadedFile.fileSize }}</p>
            </div>
          </div>
          <button (click)="removeFile()" class="text-red-600 hover:text-red-700">
            <i class="pi pi-times"></i>
          </button>
        </div>
      </div>

      <!-- Analyze Button -->
      <button
        *ngIf="uploadedFile"
        (click)="analyzeCv()"
        [disabled]="isLoading"
        class="w-full mt-4 py-3 bg-gradient-to-r from-green-600 to-green-700 text-white font-semibold rounded-xl hover:from-green-700 hover:to-green-800 disabled:from-gray-300 disabled:to-gray-400 disabled:cursor-not-allowed transition-all duration-200 shadow-sm hover:shadow-md"
      >
        <span *ngIf="!isLoading">Analyze CV</span>
        <span *ngIf="isLoading">
          <i class="pi pi-spin pi-spinner mr-2"></i>Analyzing...
        </span>
      </button>
    </div>
  </div>

  <!-- Right: Analysis Results -->
  <div class="space-y-6" *ngIf="analysisText">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <!-- Header with Score and Copy Button -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Analysis Results</h2>
          <p class="text-sm text-gray-500 mt-1">Comprehensive CV Analysis</p>
        </div>
        <button
          (click)="copyToClipboard()"
          class="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 transition-colors border border-blue-200"
          title="Copy to clipboard"
        >
          <i class="pi pi-copy"></i>
          <span class="text-sm font-medium">Copy</span>
        </button>
      </div>

      <!-- Overall Score Badge -->
      <div *ngIf="overallScore > 0" class="mb-6">
        <div class="inline-flex items-center gap-3 px-6 py-4 rounded-xl border-2" [ngClass]="getScoreBadgeColor()">
          <div>
            <p class="text-sm font-medium opacity-75 mb-1">Overall ATS Score</p>
            <p class="text-4xl font-bold">{{ overallScore }}<span class="text-2xl">/100</span></p>
          </div>
          <div class="w-16 h-16 relative">
            <svg class="transform -rotate-90 w-16 h-16">
              <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="4" fill="none" class="opacity-20" />
              <circle
                cx="32"
                cy="32"
                r="28"
                stroke="currentColor"
                stroke-width="4"
                fill="none"
                stroke-dasharray="175.93"
                [attr.stroke-dashoffset]="175.93 - (175.93 * overallScore) / 100"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
      </div>

      <!-- Analysis Content -->
      <div class="bg-gray-50 rounded-lg p-6 border border-gray-200">
        <pre class="text-gray-700 whitespace-pre-wrap leading-relaxed text-sm font-sans overflow-x-auto">{{ analysisText }}</pre>
      </div>
    </div>
  </div>
</div>
