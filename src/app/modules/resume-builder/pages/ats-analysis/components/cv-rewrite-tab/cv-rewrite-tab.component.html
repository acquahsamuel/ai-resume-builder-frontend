<div class="grid lg:grid-cols-2 gap-6 mt-4">
	<!-- Left Column: Input Section -->
	<div class="space-y-6">
		<!-- Job Description -->
		<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
			<div class="flex items-center gap-3 mb-4">
				<div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
					<i class="pi pi-file-edit text-green-600 text-xl"></i>
				</div>
				<h2 class="text-xl font-bold text-gray-900">Job Description</h2>
			</div>

			<div>
				<label class="block text-sm font-semibold text-gray-700 mb-2">
					Paste Job Description
				</label>
				<textarea [(ngModel)]="jobDescription"
					placeholder="Paste the job description you want to match..."
					class="w-full h-48 p-4 border-2 border-gray-200 rounded-xl focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition-all resize-none text-gray-700"></textarea>
				<p class="text-xs text-gray-500 mt-2">
					{{ jobDescription.length }} characters
				</p>
			</div>
		</div>

		<!-- CV Upload -->
		<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
			<div class="flex items-center gap-3 mb-4">
				<div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
					<i class="pi pi-file-pdf text-green-600 text-xl"></i>
				</div>
				<h2 class="text-xl font-bold text-gray-900">Upload Your CV</h2>
			</div>

			<!-- Upload Area -->
			<div (dragover)="onDragOver($event)"
				(drop)="onDrop($event)"
				(click)="triggerFileInput()"
				class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-green-400 transition-colors bg-gray-50 cursor-pointer">
				<i class="pi pi-cloud-upload text-5xl text-gray-400 mb-4"></i>
				<p class="text-gray-700 font-medium mb-1">
					Click to upload or drag and drop
				</p>
				<p class="text-sm text-gray-500">
					PDF or DOCX (max 10MB)
				</p>
				<input (change)="onFileSelected($event)"
					id="file-input-rewrite"
					type="file"
					accept=".pdf,.docx"
					class="hidden">
			</div>

			<!-- File Info -->
			<div *ngIf="uploadedFile"
				class="mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
				<div class="flex items-center justify-between">
					<div class="flex items-center gap-3">
						<i class="pi pi-file text-green-600 text-xl"></i>
						<div>
							<p class="font-medium text-gray-900">
								{{ uploadedFile.fileName }}
							</p>
							<p class="text-sm text-gray-500">
								{{ uploadedFile.fileSize }}
							</p>
						</div>
					</div>
					<button (click)="removeFile()"
						class="text-red-600 hover:text-red-700">
						<i class="pi pi-times"></i>
					</button>
				</div>
			</div>

			<!-- Rewrite Button -->
			<button [disabled]="!jobDescription || !uploadedFile || isProcessing"
				(click)="rewriteCv()"
				class="w-full mt-4 py-3 bg-gradient-to-r from-green-600 to-green-700 text-white font-semibold rounded-xl hover:from-green-700 hover:to-green-800 disabled:from-gray-300 disabled:to-gray-400 disabled:cursor-not-allowed transition-all duration-200 shadow-sm hover:shadow-md">
				<span *ngIf="!isProcessing">Rewrite CV</span>
				<span *ngIf="isProcessing">
					<i class="pi pi-spin pi-spinner mr-2"></i>
					Processing...
				</span>
			</button>
		</div>
	</div>

	<!-- Right Column: Results -->
	<div *ngIf="rewrittenCv"
		class="space-y-6">
		<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
			<!-- Header with Actions -->
			<div class="flex items-center justify-between mb-6">
				<div>
					<h2 class="text-xl font-bold text-gray-900">Rewritten CV</h2>
					<p class="text-sm text-gray-500 mt-1">
						Optimized for ATS & Job Match
					</p>
				</div>
				<div class="flex gap-2">
					<button (click)="copyToClipboard()"
						class="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 transition-colors border border-blue-200"
						title="Copy to clipboard">
						<i class="pi pi-copy"></i>
						<span class="text-sm font-medium">Copy</span>
					</button>
					<button (click)="downloadRewrittenCv()"
						class="flex items-center gap-2 px-4 py-2 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 transition-colors border border-green-200"
						title="Download as text file">
						<i class="pi pi-download"></i>
						<span class="text-sm font-medium">Download</span>
					</button>
				</div>
			</div>

			<!-- Rewritten CV Content -->
			<div class="bg-gray-50 rounded-lg p-6 border border-gray-200">
				<pre class="text-gray-700 whitespace-pre-wrap leading-relaxed text-sm font-sans overflow-x-auto">{{ rewrittenCv }}</pre>
			</div>
		</div>
	</div>
</div>
