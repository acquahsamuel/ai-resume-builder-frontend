<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Page Header -->
    <div class="mb-6 md:mb-8 text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">ATS Resume Analyzer</h1>
      <p class="text-gray-600 text-base md:text-lg">
        Optimize your resume for Applicant Tracking Systems
      </p>
    </div>

    <!-- Tabs Navigation -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 mb-6">
      <p-tabView [(activeIndex)]="activeTabIndex" [scrollable]="true">
        <!-- Tab 1: CV Only Analysis -->
        <p-tabPanel header="CV Analysis">
          <ng-template pTemplate="header">
            <div class="flex items-center gap-2">
              <i class="pi pi-file-pdf text-lg"></i>
              <span class="hidden sm:inline">CV Analysis</span>
              <span class="sm:hidden">CV</span>
            </div>
          </ng-template>

          <app-cv-analysis-tab></app-cv-analysis-tab>
        </p-tabPanel>

        <!-- Tab 2: Job Description & CV Compare -->
        <p-tabPanel header="Job Match">
          <ng-template pTemplate="header">
            <div class="flex items-center gap-2">
              <i class="pi pi-briefcase text-lg"></i>
              <span class="hidden sm:inline">Job Match</span>
              <span class="sm:hidden">Match</span>
            </div>
          </ng-template>

          <app-job-match-tab></app-job-match-tab>
        </p-tabPanel>

        <!-- Tab 3: CV Rewrite -->
        <p-tabPanel header="CV Rewrite">
          <ng-template pTemplate="header">
            <div class="flex items-center gap-2">
              <i class="pi pi-pencil text-lg"></i>
              <span class="hidden sm:inline">CV Rewrite</span>
              <span class="sm:hidden">Rewrite</span>
            </div>
          </ng-template>

          <app-cv-rewrite-tab></app-cv-rewrite-tab>
        </p-tabPanel>
      </p-tabView>
    </div>
  </div>
</div>
